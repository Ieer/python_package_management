[build-system]
requires = ["setuptools>=67"]
build-backend = "setuptools.build_meta"

[project]
name = "python311-offline-workbench"
version = "0.1.0"
description = "Offline Python 3.11 package audit, dependency and admission workbench"
requires-python = ">=3.11,<3.12"

[project.scripts]
offline-dashboard = "offline_package.offline_dashboard:main"
offline-mcp = "offline_package.offline_mcp:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
offline_package = ["assets/*.css"]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src"]
extend-exclude = [
  "package311",
  "download",
  "bk",
  "release",
  "python_source",
  ".venv",
  "venv",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.format]
quote-style = "double"
